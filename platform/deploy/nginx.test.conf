gzip on;
gzip_types application/javascript text/css;
server {
 listen 80;
 server_name school.zangarengineering.kz *.school.zangarengineering.kz;
 root /usr/share/nginx/html;
 client_max_body_size 21m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
 location = /_host {
  internal;
  proxy_pass http://api:8080/api/v1/host-check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $http_host;
 }
 location = /api/v1/host-check { return 404; }
 location ^~ /api/ {
  proxy_pass http://api:8080;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
 }
 location ^~ /files/ { proxy_pass http://api:8080; proxy_set_header Host $http_host; }
 location = /healthz { proxy_pass http://api:8080; proxy_set_header Host $http_host; }
 location / {
  auth_request /_host;
  error_page 403 =404 /site-not-found.html;
  try_files $uri /index.html;
 }
 location = /site-not-found.html { internal; }
 location /assets/ {
  auth_request /_host;
  error_page 403 =404 /site-not-found.html;
  try_files $uri =404;
 }
}
