name: shymkent-school-local
services:
  postgres:
    extends:
      file: compose.local.yaml
      service: postgres
  api:
    extends:
      file: compose.local.yaml
      service: api
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c 'npm ci && npm run dev -- --host 0.0.0.0 --strictPort'
    environment:
      DEV_API_TARGET: http://api:8080
    volumes:
      - ../web:/app
      - node_modules:/app/node_modules
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header=Host: school.localhost", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
volumes:
  postgres:
  uploads:
  node_modules:
