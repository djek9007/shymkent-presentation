# Inside nginx http {}. auth_request_module is required.
gzip on;
gzip_types application/javascript text/css;
gzip_vary on;
upstream school_api { server 127.0.0.1:8080; keepalive 16; }
server { listen 80; server_name school.edu.gov.kz *.school.edu.gov.kz; return 301 https://$host$request_uri; }
server {
 listen 443 ssl;
 server_name school.edu.gov.kz *.school.edu.gov.kz;
 ssl_certificate /etc/letsencrypt/live/school.edu.gov.kz/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/school.edu.gov.kz/privkey.pem;
 root /srv/school-platform/web/dist;
 client_max_body_size 21m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
 add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
 location = /_host {
  internal;
  proxy_pass http://school_api/api/v1/host-check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $host;
 }
 location = /api/v1/host-check { return 404; }
 location ^~ /api/ { proxy_pass http://school_api; proxy_set_header Host $host; proxy_set_header Origin $http_origin; proxy_set_header X-Real-IP $remote_addr; }
 location ^~ /files/ { proxy_pass http://school_api; proxy_set_header Host $host; }
 location = /healthz { proxy_pass http://school_api; proxy_set_header Host $host; }
 location / {
  auth_request /_host;
  # host-check returns 403 for unknown/disabled hosts; expose public 404.
  error_page 403 =404 /site-not-found.html;
  try_files $uri /index.html;
 }
 location = /index.html {
  auth_request /_host;
  error_page 403 =404 /site-not-found.html;
  expires -1;
 }
 location = /site-not-found.html { internal; }
 location /assets/ {
  auth_request /_host;
  error_page 403 =404 /site-not-found.html;
  try_files $uri =404;
  expires 1y;
 }
}
